name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release
  queue: max
  cancel-in-progress: false
jobs:
  tests:
    name: Release tests (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
  release:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Pack and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { readFileSync } from "node:fs";
            const latest = execFileSync("git", ["tag", "--list", "--sort=-v:refname"], { encoding: "utf8" })
              .split("\n").find((tag) => /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag));
            const base = latest ? latest.slice(1) : JSON.parse(readFileSync("package.json", "utf8")).version;
            const [major, minor, patch] = base.split(".");
            console.log([major, minor, BigInt(patch) + 1n].join("."));
          ')
          tag="v${version}"
          npm version "$version" --no-git-tag-version --ignore-scripts
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/deslop-${version}.tgz" "$RUNNER_TEMP/deslop.tgz"
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" --silent
          gh release create "$tag" "$RUNNER_TEMP/deslop.tgz" \
            --verify-tag --title "$tag" \
            --notes "Installable package for commit ${GITHUB_SHA}." --latest
